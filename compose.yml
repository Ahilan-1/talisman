name: talisman
services:
  talisman:
    image: talisman-control:local
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:1455:1455"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TALISMAN_DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - talisman_data:/data
    restart: unless-stopped
  provisioner:
    image: talisman-control:local
    command: ["node", "provisioner.mjs"]
    environment:
      TALISMAN_DATA_DIR: /data
      TALISMAN_DOCKER_NETWORK: talisman_default
      TALISMAN_INTERNAL_URL: http://talisman:3000
      TALISMAN_DESKTOP_IMAGE: talisman-desktop:local
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - talisman_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  desktop-image:
    profiles: ["build"]
    image: talisman-desktop:local
    build:
      context: .
      dockerfile: desktop/Dockerfile
volumes:
  talisman_data:
